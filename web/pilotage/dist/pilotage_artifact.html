<title>Pilotage YEBA FORMATIONS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Pilotage YEBA FORMATIONS — charte 2026 : bleu #1B3A6B (confiance), or #C9AB4C (qualité), noir #121212, blanc.
   Montserrat pour les titres, Inter pour le texte (très lisible, corps 1.15rem). Accessibilité : l'or (2,3:1 sur blanc)
   n'est JAMAIS du texte sur fond clair ; il sert aux filets et aplats, et au texte sur bleu (4,9:1) ou sur noir (8,2:1).
   --marque / --accent-marque sont réécrites par la charte saisie dans Réglages. */
:root {
  --marque: #1B3A6B; --accent-marque: #C9AB4C;
  --encre: var(--marque); --accent: var(--marque);
  --fond: #F3F5F9; --surface: #FFFFFF; --surface-2: #EEF2F8; --texte: #121212; --doux: #47515E; --trait: #C8D0DC;
  --ok: #1E6B3A; --ok-fond: #E5F3EA; --alerte: #7A4600; --alerte-fond: #FFF3DC; --ko: #9B1C1C; --ko-fond: #FDECEC;
  --police: "Inter", "Segoe UI", "Verdana", sans-serif;
  --titres: "Montserrat", "Inter", "Segoe UI", sans-serif;
  --mono: "Inter", "Consolas", monospace;
  --t-base: 1.15rem; --t-petit: 1rem; --t-h2: 1.45rem; --t-h1: clamp(1.8rem, 4vw, 2.5rem);
  --rayon: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --encre: #E3CF8E; --accent: #C9AB4C; --fond: #121212; --surface: #1B1F27; --surface-2: #232A36; --texte: #F1F3F6; --doux: #A9B6C3; --trait: #2E3B49;
  --ok: #7FD39A; --ok-fond: #15301F; --alerte: #F5C27A; --alerte-fond: #33240F; --ko: #F49A9A; --ko-fond: #3A1616; color-scheme: dark } }
:root[data-theme="dark"] {
  --encre: #E3CF8E; --accent: #C9AB4C; --fond: #121212; --surface: #1B1F27; --surface-2: #232A36; --texte: #F1F3F6; --doux: #A9B6C3; --trait: #2E3B49;
  --ok: #7FD39A; --ok-fond: #15301F; --alerte: #F5C27A; --alerte-fond: #33240F; --ko: #F49A9A; --ko-fond: #3A1616; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html { scroll-padding-top: 90px }
body { margin: 0; background: var(--fond); color: var(--texte); font-family: var(--police); font-size: var(--t-base); line-height: 1.55; min-height: 100vh }
a { color: var(--encre) }
h1, h2, h3, .tuile b, #barre .marque { font-family: var(--titres) }

/* ------------------------------------------------ barre de navigation */
#barre { position: sticky; top: 0; z-index: 20; background: var(--marque); color: #fff; box-shadow: 0 3px 0 var(--accent-marque) }
#logo-nav { height: 44px; width: auto; display: block; border-radius: 4px }
#barre .dedans { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)) }
#barre .marque { font-weight: 700; font-size: 1.1rem; letter-spacing: .02em; white-space: nowrap; flex: none }
#nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; flex: 1; min-width: 0 }
#nav a { color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap; font-weight: 700; font-size: 1.02rem }
#nav a:hover { background: rgba(255,255,255,.14) }
#nav a[aria-current="page"] { background: var(--accent-marque); color: var(--marque) }
#etat-sauvegarde { font-family: var(--mono); font-size: .85rem; opacity: .9; white-space: nowrap; flex: none }
@media (max-width: 760px) { #barre .dedans { flex-wrap: wrap } #nav { order: 3; flex-basis: 100% } #barre .marque { flex: 1 } }

main { max-width: 1280px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)) }
#vue { display: grid; gap: 22px; min-width: 0 }
#vue > * { min-width: 0 }
#vue > .lien, #vue > p > .lien { justify-self: start }

/* ------------------------------------------------ titres */
.titre-vue { display: grid; gap: 4px; border-bottom: 3px solid var(--marque); padding-bottom: 12px }
.titre-vue h1 { margin: 0; font-size: var(--t-h1); line-height: 1.12; color: var(--encre); text-wrap: balance; overflow-wrap: anywhere }
.titre-vue p { margin: 0; color: var(--doux); max-width: 80ch }
h2 { font-size: var(--t-h2); margin: 0 0 10px; color: var(--encre); text-wrap: balance }
h3 { font-size: 1.2rem; margin: 14px 0 8px; color: var(--encre) }
.etiquette { font-family: var(--mono); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
.discret { color: var(--doux) }
.petit { font-size: var(--t-petit) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.vide { color: var(--doux); font-style: italic }

/* ------------------------------------------------ blocs */
.carte, section.carte { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 20px 22px; min-width: 0 }
@media (max-width: 480px) { .carte, section.carte { padding: 16px 14px } }
.deux-colonnes { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start }
.trois { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: start }
@media (max-width: 1000px) { .trois { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 900px) { .deux-colonnes { grid-template-columns: minmax(0, 1fr) } }
.deux-colonnes > section, .trois > section { min-width: 0 }
.pile { display: grid; gap: 12px; min-width: 0 }
.collant { position: sticky; top: 84px }
@media (max-width: 900px) { .collant { position: static } }

/* ------------------------------------------------ tuiles */
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px }
.tuile { font: inherit; text-align: left; display: grid; gap: 2px; background: var(--surface); color: var(--texte); border: 1px solid var(--trait); border-left: 6px solid var(--marque);
  border-radius: var(--rayon); padding: 14px 16px; cursor: pointer; min-width: 0 }
.tuile span { color: var(--doux); font-size: var(--t-petit) }
.tuile b { font-size: 1.7rem; line-height: 1.15; color: var(--encre); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.tuile small { color: var(--doux); font-size: .95rem }
.tuile:hover { border-color: var(--accent) }
.tuile.alerte { border-left-color: var(--alerte); background: var(--alerte-fond) }
.tuile.ko { border-left-color: var(--ko); background: var(--ko-fond) }
.tuile.ok { border-left-color: var(--ok) }

/* ------------------------------------------------ formulaires */
.grille-champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; align-items: end }
.grille-champs .large { grid-column: 1 / -1 }
label { display: grid; gap: 4px; font-weight: 700; min-width: 0 }
label small { font-weight: 400; color: var(--doux); font-size: var(--t-petit) }
input, select, textarea { font: inherit; font-size: 1.05rem; padding: 10px 12px; border: 2px solid var(--trait); border-radius: 8px; background: var(--surface); color: var(--texte); width: 100%; min-width: 0 }
textarea { min-height: 96px; resize: vertical }
input[type=color] { padding: 2px; height: 48px }
input[type=checkbox], input[type=radio] { width: 1.35rem; height: 1.35rem; accent-color: var(--marque); flex: none; margin: 0 }
label.coche { display: flex; gap: 10px; align-items: center; font-weight: 400; cursor: pointer }
fieldset.jours { border: 2px solid var(--trait); border-radius: 8px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0; min-width: 0 }
fieldset.jours legend { font-weight: 700; padding: 0 6px }
:focus-visible { outline: 4px solid var(--marque); outline-offset: 2px; box-shadow: 0 0 0 7px var(--accent-marque) }

/* ------------------------------------------------ boutons */
button { font: inherit; cursor: pointer }
button:disabled { opacity: .55; cursor: progress }
.principal, .principal-court, .second { border-radius: 8px; padding: 12px 18px; font-weight: 700; font-size: 1.05rem; border: 2px solid var(--marque) }
.principal, .principal-court { background: var(--marque); color: #fff }
.principal { width: 100% }
.principal:hover, .principal-court:hover { filter: brightness(1.12) }
.second { background: var(--surface); color: var(--encre) }
.second:hover { background: var(--surface-2) }
.lien { background: none; border: none; color: var(--encre); text-decoration: underline; padding: 4px 2px; font-size: inherit }
.danger { color: var(--ko) !important; border-color: var(--ko) }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.telech { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.telech button { width: 100%; text-align: left }

/* ------------------------------------------------ listes */
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.todo li { display: grid; grid-template-columns: minmax(7.5rem, auto) minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--trait); border-left: 5px solid var(--trait); border-radius: 8px; overflow-wrap: anywhere }
.todo li.retard { border-left-color: var(--ko); background: var(--ko-fond) }
.todo li.proche { border-left-color: var(--alerte); background: var(--alerte-fond) }
.todo .quand { font-family: var(--mono); font-size: .92rem; color: var(--doux) }
@media (max-width: 560px) { .todo li { grid-template-columns: minmax(0, 1fr) } }
.objs { margin: 0; padding-left: 1.4rem; display: grid; gap: 6px }
.verbe { color: var(--encre); font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent-marque); text-decoration-thickness: 3px; text-underline-offset: 3px }
.ligne-liste { font: inherit; width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(90px, 1fr) auto; gap: 6px 14px; align-items: center;
  background: var(--surface); color: var(--texte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere }
.ligne-liste:hover { border-color: var(--accent) }
@media (max-width: 700px) { .ligne-liste { grid-template-columns: minmax(0, 1fr) } }
.jauge { display: block; height: 12px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--trait); overflow: hidden; min-width: 60px }
.jauge i { display: block; height: 100%; background: var(--ok) }
.seance-carte { background: var(--surface); border: 1px solid var(--trait); border-left: 6px solid var(--accent-marque); border-radius: var(--rayon); padding: 14px 16px; display: grid; gap: 8px; min-width: 0 }
.choix-etat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, 180px); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--trait) }
@media (max-width: 520px) { .choix-etat { grid-template-columns: minmax(0, 1fr) } }
.puces-docs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px }
.puce { display: inline-block; font-family: var(--mono); font-size: .85rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--doux); overflow-wrap: anywhere }
.puce.ok { background: var(--ok-fond); color: var(--ok) } .puce.ko { background: var(--ko-fond); color: var(--ko) } .puce.att { background: var(--alerte-fond); color: var(--alerte) }

/* ------------------------------------------------ messages */
.message { border-radius: 8px; padding: 12px 14px; border-left: 6px solid var(--encre); background: var(--surface-2); margin: 0 }
.message.ok { border-color: var(--ok); background: var(--ok-fond) }
.message.alerte { border-color: var(--alerte); background: var(--alerte-fond) }
.message.ko { border-color: var(--ko); background: var(--ko-fond) }
#toasts { position: fixed; bottom: 18px; right: 18px; left: 18px; display: grid; justify-items: end; gap: 8px; z-index: 50; pointer-events: none }
.toast { pointer-events: auto; max-width: 520px; background: var(--surface); color: var(--texte); border: 2px solid var(--ok); border-left-width: 8px; border-radius: 8px; padding: 12px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.18) }
.toast.ko { border-color: var(--ko) } .toast.alerte { border-color: var(--alerte) }

/* ------------------------------------------------ tableaux */
.defile { overflow-x: auto; border: 1px solid var(--trait); border-radius: 8px; background: var(--surface); max-width: 100% }
table { border-collapse: collapse; width: 100%; font-size: 1.02rem }
th, td { padding: 9px 11px; border-bottom: 1px solid var(--trait); text-align: left; vertical-align: top }
th { background: var(--surface-2); color: var(--encre); position: sticky; top: 0 }
td input, td select { padding: 6px 8px; font-size: 1rem; min-width: 7rem }
tr:last-child td { border-bottom: none }

/* ------------------------------------------------ Qualiopi */
.indicateur { background: var(--surface); border: 1px solid var(--trait); border-left: 6px solid var(--trait); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0 }
.indicateur.pret { border-left-color: var(--ok) }
.indicateur.en_cours { border-left-color: var(--alerte) }
.indicateur.a_faire { border-left-color: var(--ko) }
.indicateur.na { opacity: .62 }
.ind-tete { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center }
.preuves { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; color: var(--ok); font-size: var(--t-petit) }

/* ------------------------------------------------ graphe */
.graphe { margin: 0 }
.graphe figcaption { font-weight: 700; margin-bottom: 6px }
.graphe svg { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--trait); border-radius: 8px }
.graphe .axe { stroke: var(--doux); stroke-dasharray: 4 4 }
.graphe .courbe { fill: none; stroke: var(--encre); stroke-width: 3; stroke-linejoin: round }
.graphe .lib { fill: var(--doux); font-size: 12px; font-family: var(--mono) }
.graphe .point { fill: var(--ko) }

/* ------------------------------------------------ connexion */
#connexion { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(160deg, var(--marque) 0 38%, var(--fond) 38%) }
.carte-connexion { width: min(560px, 100%); background: var(--surface); border-radius: 14px; padding: 28px 26px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.2) }
.carte-connexion h1 { margin: 0; color: var(--encre); font-size: var(--t-h1) }
.carte-connexion p { margin: 0 }
.carte-connexion form { display: grid; gap: 12px }
.carte-connexion details { border-top: 1px solid var(--trait); padding-top: 10px }
.carte-connexion summary { cursor: pointer; font-weight: 700 }

/* ------------------------------------------------ tableau de bord financier */
.tableau-bord { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)) }
.tableau-bord .tuile b { font-size: 1.9rem }
.rapprochement { border-left: 6px solid var(--accent-marque); display: grid; gap: 10px }
.rapprochement .ind-tete .num { font-size: 1.3rem }
.propositions { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.propositions li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 14px; align-items: center; padding: 10px 12px; border: 1px solid var(--trait); border-radius: 8px; background: var(--surface-2) }
@media (max-width: 640px) { .propositions li { grid-template-columns: minmax(0, 1fr) } }
.score { font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 2px solid var(--trait) }
.score.ok { border-color: var(--ok); color: var(--ok) } .score.att { border-color: var(--alerte); color: var(--alerte) } .score.ko { border-color: var(--ko); color: var(--ko) }
label.second { display: inline-block; cursor: pointer; padding: 8px 14px; font-weight: 700 }
.apercu-logo { max-height: 110px; width: auto; border-radius: 6px }
.logo-connexion { width: 150px; height: auto; border-radius: 10px; justify-self: start }
tr.retard td { background: var(--ko-fond) }
td .puce, td .score { white-space: nowrap; overflow-wrap: normal }
details > summary { cursor: pointer; padding: 6px 0 }

@media print { #barre, #toasts, button { display: none !important } body { background: #fff } }
</style>

<div id="connexion"></div>
<div id="app" hidden>
  <header id="barre"><div class="dedans">
    <img id="logo-nav" alt="" hidden><span class="marque">Pilotage</span>
    <nav id="nav" aria-label="Sections">
      <a href="#accueil" data-v="accueil">Aujourd'hui</a>
      <a href="#formations" data-v="formations">Formations</a>
      <a href="#seance" data-v="seance">Séance</a>
      <a href="#actions" data-v="actions">Actions</a>
      <a href="#qualiopi" data-v="qualiopi">Qualiopi</a>
      <a href="#finances" data-v="finances">Finances</a>
      <a href="#partenaires" data-v="partenaires">Partenaires</a>
      <a href="#reglages" data-v="reglages">Réglages</a>
    </nav>
    <span id="etat-sauvegarde" aria-live="polite"></span>
  </div></header>
  <main><div id="vue" aria-live="polite"></div></main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
/* Analyse des référentiels (REAC, RE/RC, fiche France Compétences) — portage
 * fidèle de decorticage/referentiels.py. Les Activités types et Compétences
 * sont reprises MOT POUR MOT. */
(function (G) {
  "use strict";
  const D = (G.Decorticage = G.Decorticage || {});

  function normaliser(s) {
    return (s || "").replace(/’/g, "'").normalize("NFKD").replace(/[̀-ͯ]/g, "")
      .replace(/[^\x00-\x7f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  }
  // \b de JS ne connaît pas les lettres accentuées : on utilise \p{L} (drapeau u)
  const LIAISONS_FIN = /(?:[,;:(\-]|(?<!\p{L})(?:de|du|des|et|la|le|les|à|au|aux|en|un|une|par|pour|sur|avec|ou|dans|son|sa|ses|leur|leurs)|(?<!\p{L})[dl][’'])$/iu;
  const estMinuscule = (c) => c && c !== c.toUpperCase() && c === c.toLowerCase();
  const parOuv = (s) => (s.match(/\(/g) || []).length > (s.match(/\)/g) || []).length;

  function joindreItems(lignes) {
    const items = [];
    for (const brute of lignes) {
      let l = brute.trim();
      if (!l) continue;
      l = l.replace(/^-\s+/, "");
      const suite = items.length && (estMinuscule(l[0]) || "(…).".includes(l[0]) ||
        LIAISONS_FIN.test(items[items.length - 1]) || parOuv(items[items.length - 1]));
      if (suite) items[items.length - 1] += " " + l; else items.push(l);
    }
    return items.map((i) => i.replace(/\s+/g, " ").trim().replace(/\.$/, "").trim());
  }

  function decouperPhrases(lignes) {
    const blocs = [];
    for (const brute of lignes) {
      const l = brute.trim();
      if (!l) continue;
      const der = blocs[blocs.length - 1];
      if (blocs.length && (estMinuscule(l[0]) || LIAISONS_FIN.test(der) || parOuv(der))) blocs[blocs.length - 1] += " " + l;
      else blocs.push(l);
    }
    const phrases = [];
    for (const b of blocs)
      for (let p of b.split(/(?<=[.!?])\s+(?=[A-ZÀÂÉÈÊÎÔÛÇ])/)) {
        p = p.trim().replace(/\.$/, "").trim();
        if (p.length > 3) phrases.push(p);
      }
    return phrases;
  }

  // Texte entre `debut` et la première des `fins` (regex multilignes)
  function section(texte, debut, fins) {
    const m = new RegExp(debut, "im").exec(texte);
    if (!m) return "";
    const reste = texte.slice(m.index + m[0].length);
    let fin = reste.length;
    for (const f of fins) {
      const mm = new RegExp(f, "im").exec(reste);
      if (mm && mm.index < fin) fin = mm.index;
    }
    return reste.slice(0, fin);
  }

  function titreMultiligne(lignes, arret) {
    const re = new RegExp(arret, "i");
    const t = [];
    let i = 0;
    while (i < lignes.length && !re.test(lignes[i])) { if (lignes[i].trim()) t.push(lignes[i].trim()); i++; }
    return [t.join(" ").replace(/\s+/g, " ").trim(), lignes.slice(i)];
  }

  const SOUS = [
    ["sf_techniques", "^\\s*1\\s*[-–]\\s*Savoir-faire techniques"],
    ["sf_organisationnels", "^\\s*2\\s*[-–]\\s*Savoir-faire organisationnels"],
    ["sf_relationnels", "^\\s*3\\s*[-–]\\s*Savoir-faire relationnels"],
    ["savoirs", "^\\s*4\\s*[-–]\\s*Savoirs"],
  ];

  function parserCompetence(numero, bloc) {
    const [intitule, reste] = titreMultiligne(bloc.split("\n"), "^Description de la comp");
    const texte = reste.join("\n");
    const cp = { numero, intitule, at_numero: 0, description: [], contexte: "", criteres: [],
      sf_techniques: [], sf_organisationnels: [], sf_relationnels: [], savoirs: [] };
    cp.description = decouperPhrases(section(texte, "^Description de la comp.*$", ["^Contexte\\(s\\) professionnel"]).split("\n"));
    cp.contexte = section(texte, "^Contexte\\(s\\) professionnel.*$", ["^Crit[èe]res de performance"]).replace(/\s+/g, " ").trim();
    cp.criteres = joindreItems(section(texte, "^Crit[èe]res de performance\\s*$", ["^Savoir-faire techniques, savoir", "^\\s*1\\s*[-–]"]).split("\n"));
    SOUS.forEach(([attr, motif], i) => {
      const fins = SOUS.slice(i + 1).map((x) => x[1]).concat(["^FICHE ", "$(?![\\s\\S])"]);
      cp[attr] = joindreItems(section(texte, motif + ".*$", fins).split("\n"));
    });
    return cp;
  }
  const volume = (cp) => cp.sf_techniques.length + cp.sf_organisationnels.length + cp.sf_relationnels.length + cp.savoirs.length + cp.criteres.length;

  function analyserReac(texte, brut) {
    const reac = { intitule: "", sigle: "", niveau: "", code_titre: "", millesime: "", date_validation: "",
      activites: [], competences: [], transversales: [], avertissements: [] };
    const src = brut || texte;
    let m = /\b([A-Z]{2,6})\s+(?:REAC|RE|RC)\s+(TP-\d{5})\s+(\d{1,2})\s+(\d{2}\/\d{2}\/\d{4})/.exec(src);
    if (m) [, reac.sigle, reac.code_titre, reac.millesime, reac.date_validation] = m;
    m = /DU TITRE PROFESSIONNEL\s*\n\s*(.+?)\s*\n/.exec(src);
    if (m) reac.intitule = m[1].trim();
    m = /\bNiveau\s+(\d)\b/.exec(src);
    if (m) reac.niveau = m[1];

    const reAT = /^FICHE ACTIVIT[ÉE] TYPE N°\s*(\d+)\s*$/gm, reCP = /^FICHE COMP[ÉE]TENCE PROFESSIONNELLE N°\s*(\d+)\s*$/gm;
    const pAT = [...texte.matchAll(reAT)], pCP = [...texte.matchAll(reCP)];
    const premiereCP = pCP[0];
    pAT.forEach((m, k) => {
      const fin = k + 1 < pAT.length ? pAT[k + 1].index : (premiereCP ? premiereCP.index : texte.length);
      const bloc = texte.slice(m.index + m[0].length, fin);
      const [intitule] = titreMultiligne(bloc.split("\n"), "^D[ée]finition");
      reac.activites.push({ numero: +m[1], intitule, competences: [],
        description: section(bloc, "^D[ée]finition.*$", ["^R[ée]glementation", "^Liste des comp"]).replace(/\s+/g, " ").trim(),
        _liste: joindreItems(section(bloc, "^Liste des comp[ée]tences professionnelles.*$", ["^Comp[ée]tences transversales"]).split("\n")) });
    });
    let finGlobale = texte.length;
    if (pCP.length) {
      const re = /^(FICHE DES COMP[ÉE]TENCES TRANSVERSALES|FICHE COMP[ÉE]TENCES TRANSVERSALES|Glossaire)/gim;
      re.lastIndex = pCP[pCP.length - 1].index + 10;
      const f = re.exec(texte);
      if (f) finGlobale = f.index;
    }
    pCP.forEach((m, k) => {
      const fin = k + 1 < pCP.length ? pCP[k + 1].index : finGlobale;
      reac.competences.push(parserCompetence(+m[1], texte.slice(m.index + m[0].length, fin)));
    });
    for (const at of reac.activites) {
      for (const lib of at._liste) {
        const cle = normaliser(lib).slice(0, 45);
        for (const cp of reac.competences)
          if (normaliser(cp.intitule).slice(0, 45) === cle) { cp.at_numero = at.numero; if (!at.competences.includes(cp.numero)) at.competences.push(cp.numero); }
      }
      delete at._liste;
    }
    reac.transversales = joindreItems(section(texte, "^Comp[ée]tences transversales de l.emploi\\s*$", ["^Niveau et/ou", "^FICHE"]).split("\n"));
    if (!reac.activites.length) reac.avertissements.push("Aucune fiche « Activité type » trouvée : ce document est-il bien un REAC ?");
    if (!reac.competences.length) reac.avertissements.push("Aucune fiche « Compétence professionnelle » trouvée.");
    for (const cp of reac.competences) {
      if (!cp.at_numero) reac.avertissements.push(`CP${cp.numero} non rattachée à une activité type : vérifier.`);
      if (!cp.criteres.length) reac.avertissements.push(`CP${cp.numero} : critères de performance introuvables.`);
    }
    reac.competence = (n) => reac.competences.find((c) => c.numero === n);
    reac.activite = (n) => reac.activites.find((a) => a.numero === n);
    return reac;
  }

  // ------------------------------------------------------------------ RE / RC
  const MODALITES = ["Mise en situation professionnelle", "Présentation d'un projet réalisé en amont de la session",
    "Questionnement à partir de production(s)", "Questionnaire professionnel", "Entretien technique", "Entretien final",
    "Entretien technique final"];
  const RE_DUREE = /(\d{1,2})\s*h\s*(\d{2})\s*min/;
  const minutesDe = (s) => { const m = RE_DUREE.exec(s); return m ? +m[1] * 60 + +m[2] : 0; };

  function analyserRe(texte, reac) {
    const r = { epreuves: [], duree_totale: "", periode_entreprise: [], productions: [], documents: [], diaporamas: [], avertissements: [] };
    const norm = texte.replace(/'/g, "’");
    let tab = section(norm, "^\\s*3\\.1\\.?\\s*Modalités d’évaluation des compétences et organisation de l’épreuve", ["^Informations complémentaires", "^3\\.2\\."]);
    if (!tab) tab = section(norm, "^Modalités d’évaluation des compétences et organisation de l’épreuve\\s*$", ["^Informations complémentaires", "^3\\.2\\."]);
    if (!tab) r.avertissements.push("Tableau des modalités d'évaluation introuvable.");
    const debuts = [...tab.matchAll(/^\s*(?:-\s*)?(Mise en situation|Entretien technique|Questionnaire|Questionnement à partir|Entretien final|Présentation d’un projet)/gm)];
    const titres = (reac ? reac.competences : []).map((c) => [c.numero, normaliser(c.intitule).slice(0, 40)]);
    debuts.forEach((m, i) => {
      const morceau = tab.slice(m.index, i + 1 < debuts.length ? debuts[i + 1].index : tab.length);
      const tete = normaliser(morceau.replace(/^[\s-]+/, ""));
      const nom = MODALITES.find((x) => tete.startsWith(normaliser(x).slice(0, 18))) || m[1];
      const dm = RE_DUREE.exec(morceau);
      if (normaliser(morceau.slice(0, 200)).includes("sans objet") && !dm) return;
      const mn = normaliser(morceau);
      r.epreuves.push({ modalite: nom, duree: dm ? dm[0] : "", minutes: minutesDe(morceau),
        competences: titres.filter(([, t]) => t && mn.includes(t)).map(([n]) => n), detail: morceau.replace(/\s+/g, " ").trim().slice(0, 1500) });

    while (base.reduce((a, b) => a + b, 0) < u) { base[restes[k % restes.length]]++; k++; }

      "Chaque ligne = un créneau réel (pauses exclues). Colonne « Réalisé » : liste déroulante.", nomOrg);
    f.entetes(["Date · semaine", "Horaire", "Durée", "CP", "Séance", "Objectif pédagogique", "Cumul · % avancé", "Réalisé ?", "Observations"]);
    let jp = null; bande = false;
    for (const l of plan.lignes) {
      const s = l.seance, o = l.objectif, d = l.date;
      if (D.iso(d) !== jp) { bande = !bande; jp = D.iso(d); }
      const rr = f.rangee([`${D.JOURS[D.jourSem(d)].slice(0, 3).replace(/^./, (x) => x.toUpperCase())} ${D.fr(d)}\nSem. ${D.semaineIso(d)[1]}`,
        `${D.fmtHm(l.debut)} – ${D.fmtHm(l.fin)}`, D.fmtDuree(l.minutes), s.cp ? `CP${s.cp}` : "—", `S${s.numero} — ${s.titre}`,
        riche(st, o.verbe, o.texte + (l.suite ? " (suite)" : "")), `${D.fmtDuree(l.cumul)}\n${pct(l.pourcentage)}`, "", ""], { bande });
      f.ws.getCell(rr, 8).dataValidation = { type: "list", allowBlank: true, formulae: ['"Oui,Partiel,Non,Reporté"'] };
    }
    f.filtre(9);

    // Planning par jour
    const parJour = groupe(plan.lignes, (l) => D.iso(l.date));
    f = new Feuille(wb, "Planning par jour", st, [16, 12, 8, 16, 70, 12, 12], "Séances prévues par jour", "", nomOrg);
    f.entetes(["Date", "Jour", "Sem.", "Mois", "Séances et objectifs du jour", "Heures", "Cumul"]);
    let cumul = 0, i = 0;
    for (const [, ls] of parJour) {
      const d = ls[0].date, mn = ls.reduce((t, x) => t + x.minutes, 0);
      cumul += mn;
      const ss = groupe(ls, (x) => x.seance.numero);
      const txt = [...ss.values()].map((xs) => `S${xs[0].seance.numero} — ${xs[0].seance.titre} (${D.fmtHm(xs[0].debut)}-${D.fmtHm(xs[xs.length - 1].fin)})`).join("\n");
      f.rangee([D.fr(d), D.JOURS[D.jourSem(d)].replace(/^./, (x) => x.toUpperCase()), D.semaineIso(d)[1], `${D.MOIS[d.getUTCMonth()].replace(/^./, (x) => x.toUpperCase())} ${d.getUTCFullYear()}`, txt, D.fmtDuree(mn), D.fmtDuree(cumul)], { bande: i++ % 2 === 1 });
    }

    // Synthèses
    f = new Feuille(wb, "Synthèses", st, [46, 16, 16, 14, 12, 38], "Synthèses : par activité type, compétence, mois et semaine", "", nomOrg);
    f.paragraphe("Par activité type et compétence", st.sousTitre);
    f.entetes(["Activité type / Compétence", "Début", "Fin", "Heures", "% du total", "Séances"], false, false);
    const ligneSyn = (lib, ls, opts) => { const m = ls.reduce((t, l) => t + l.minutes, 0); f.rangee([lib, D.fr(ls[0].date), D.fr(ls[ls.length - 1].date), D.fmtDuree(m), pct(m / total, 1), String(new Set(ls.map((l) => l.seance.numero)).size)], opts); };
    for (const at of reac.activites) {
      const la = plan.lignes.filter((l) => l.seance.at === at.numero);
      if (la.length) ligneSyn(`AT${at.numero} — ${at.intitule}`, la, { gras: true, fond: st.fondClair });
      for (const n of at.competences) { const lc = plan.lignes.filter((l) => l.seance.cp === n); if (lc.length) ligneSyn(`   CP${n} — ${reac.competence(n).intitule}`, lc); }
    }
    const autres = plan.lignes.filter((l) => !l.seance.cp);
    if (autres.length) { const m = autres.reduce((t, l) => t + l.minutes, 0); f.rangee(["Modules transverses (accueil, ECF, DP, examen blanc, bilan)", "", "", D.fmtDuree(m), pct(m / total, 1), String(new Set(autres.map((l) => l.seance.numero)).size)], { gras: true, fond: st.fondClair }); }
    f.rangee(["TOTAL", plan.lignes.length ? D.fr(plan.lignes[0].date) : "", plan.date_fin ? D.fr(plan.date_fin) : "", D.fmtDuree(total), "100 %", String(plan.seances.length)], { gras: true, fond: st.fondAccent });
    f.ligne++;
    f.paragraphe("Par mois", st.sousTitre);
    f.entetes(["Mois", "Jours de formation", "Heures", "Cumul", "% avancé", "Compétences travaillées"], false, false);
    cumul = 0; i = 0;
    for (const [, ls] of groupe(plan.lignes, (l) => `${l.date.getUTCFullYear()}-${l.date.getUTCMonth()}`)) {
      const mn = ls.reduce((t, l) => t + l.minutes, 0); cumul += mn;
      const cps = uniques(ls.filter((l) => l.seance.cp).map((l) => l.seance.cp)).sort((a, b) => a - b);
      f.rangee([`${D.MOIS[ls[0].date.getUTCMonth()].replace(/^./, (x) => x.toUpperCase())} ${ls[0].date.getUTCFullYear()}`, String(new Set(ls.map((l) => D.iso(l.date))).size), D.fmtDuree(mn), D.fmtDuree(cumul), pct(cumul / total), cps.map((c) => "CP" + c).join(", ") || "Modules"], { bande: i++ % 2 === 1 });
    }
    f.ligne++;
    f.paragraphe("Par semaine", st.sousTitre);
    f.entetes(["Semaine", "Du … au …", "Heures", "Cumul", "% avancé", "Séances"], false, false);
    cumul = 0; i = 0;
    for (const [, ls] of groupe(plan.lignes, (l) => D.semaineIso(l.date).join("-"))) {
      const mn = ls.reduce((t, l) => t + l.minutes, 0); cumul += mn;
      const nums = uniques(ls.map((l) => l.seance.numero)).sort((a, b) => a - b), [a, w] = D.semaineIso(ls[0].date);
      f.rangee([`S${w} — ${a}`, `${D.fr(ls[0].date).slice(0, 5)} → ${D.fr(ls[ls.length - 1].date).slice(0, 5)}`, D.fmtDuree(mn), D.fmtDuree(cumul), pct(cumul / total), nums.length > 1 ? `S${nums[0]} à S${nums[nums.length - 1]}` : `S${nums[0]}`], { bande: i++ % 2 === 1 });
    }

    // Programme
    const [intitule, sections] = D.construireProgramme(reac, re, fiche, plan, r, ctx.tarif);
    f = new Feuille(wb, "Programme", st, [30, 36, 48, 14, 12, 12], "", "", nomOrg);
    poserLogo(f);
    f.titre(`Programme de formation — ${intitule}`, nomOrg);
    for (const s of sections) {
      f.paragraphe(s.titre, st.sousTitre);
      s.paragraphes.forEach((p) => f.paragraphe(p));
      s.puces.forEach((p) => f.paragraphe("•  " + p));
      if (s.tableau.length) { f.entetes(s.tableau[0], false, false); s.tableau.slice(1).forEach((row, k) => f.rangee(row, { bande: k % 2 === 1 })); }
      f.ligne++;
    }
    f.paragraphe(`Mise à jour : ${D.fr(new Date(Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())))}`);

    // Examen simplifié
    const exm = D.construireExamen(reac, re, fiche);
    f = new Feuille(wb, "Examen simplifié", st, [32, 18, 50, 52], "", "", nomOrg);
    poserLogo(f);
    f.titre(`L'examen en clair — ${titreF}`, exm.duree_totale ? `Durée totale pour le candidat : ${exm.duree_totale}` : "");
    f.paragraphe("PARTIE 1 — Les épreuves", st.sousTitre);
    if (exm.partie1.length > 1) { f.entetes(exm.partie1[0], false, false); exm.partie1.slice(1).forEach((row, k) => f.rangee(row, { bande: k % 2 === 1 })); }
    exm.consignes.forEach((c) => f.paragraphe("•  " + c));
    f.ligne++;
    f.paragraphe("PARTIE 2 — Ce que le jury attend, compétence par compétence", st.sousTitre);
    f.entetes(["Compétence", "Évaluée par", "Ce qu'il faut savoir faire (critères en clair)", "À préparer avant l'examen"], false, false);
    exm.partie2.forEach((b, k) => f.rangee([b.cp, b.epreuves.join("\n") || "—", b.attendus.map((a) => "✔ " + a).join("\n"),
      b.production ? `Partie de document (${b.production.pages}) :\n` + b.production.themes.map((t) => "• " + t).join("\n") : ""], { bande: k % 2 === 1 }));

    // Couverture critères
    f = new Feuille(wb, "Couverture critères", st, [30, 62, 40, 18], "Couverture des critères d'évaluation", "Chaque critère du REAC/RE est relié aux séances qui le travaillent.", nomOrg);
    f.entetes(["Compétence", "Critère de performance / d'évaluation", "Séances", "Statut"]);
    for (const cp of reac.competences)
      for (const crit of cp.criteres) {
        const ss = plan.seances.filter((s) => s.objectifs.some((o) => o.criteres.includes(crit)) || (s.type_seance === "evaluation" && !s.cp && s.at === cp.at_numero));
        const couvre = uniques(ss.map((s) => "S" + s.numero)).join(", ");
        f.rangee([`CP${cp.numero} — ${cp.intitule}`, crit, couvre || "—", couvre ? "Couvert ✔" : "À COUVRIR ✖"], { fond: couvre ? null : st.fondAccent });
      }

    // Suivi journalier
    f = new Feuille(wb, "Suivi journalier", st, [14, 9, 80, 30, 18], "Suivi journalier — texte prêt à reprendre", "Le texte du jour est pré-rédigé à partir du décorticage. Ajustez seulement ce qui a changé.", nomOrg);
    f.entetes(["Date", "Heures", "Ce qui a été fait aujourd'hui (pré-rédigé)", "Écarts / adaptations", "Émargement vérifié"]);
    i = 0;
    for (const [, ls] of parJour) {
      const objs = uniques(ls.map((x) => x.objectif.texte)), ss = uniques(ls.map((x) => `S${x.seance.numero} « ${x.seance.titre} »`));
      const cps = uniques(ls.filter((x) => x.seance.cp).map((x) => x.seance.cp)).sort((a, b) => a - b);
      f.rangee([D.fr(ls[0].date), D.fmtDuree(ls.reduce((t, x) => t + x.minutes, 0)),
        `Séance(s) ${ss.join(", ")}${cps.length ? " — " + cps.map((c) => "CP" + c).join(", ") : ""}. Objectifs travaillés : ${objs.map((o) => o[0].toLowerCase() + o.slice(1)).join(" ; ")}.`, "", ""], { bande: i++ % 2 === 1 });
    }

    // Préparation PowerPoint
    f = new Feuille(wb, "Préparation PowerPoint", st, [8, 30, 36, 40, 38], "Trame de diaporama par séance", "Étayage de Bruner : la trame suit les 6 fonctions de tutelle (Wood, Bruner & Ross, 1976).", nomOrg);
    f.entetes(["N°", "Titre de la séance", "Diapositives clés (mots-clés REAC)", "Déroulé (étayage brunérien)", "Exercices et exemples"]);
    plan.seances.forEach((s, k) => {
      const diapos = s.objectifs.slice(0, 8).map((o) => `• ${o.verbe.toUpperCase()} : ${o.mots.slice(0, 4).join(", ")}`).join("\n") + "\nModes : " + uniques(s.objectifs.map((o) => o.mode.split(" (")[0])).sort().join(", ");
      const exemple = (s.objectifs.find((o) => o.exemple) || {}).exemple, activite = (s.objectifs.find((o) => o.activite) || {}).activite;
      const mots = uniques(s.objectifs.flatMap((o) => o.mots)).slice(0, 6);
      const E = D.ETAYAGE;
      const der = [`1. ${E[0][0]} : ${exemple || "question d’accroche sur le vécu en entreprise"}`, `2. ${E[1][0]} : une consigne, une tâche — « ${s.objectifs[0].texte} »`,
        `3. ${E[2][0]} : rappel de l'objectif et du critère de réussite`, `4. ${E[3][0]} : ${mots.join(", ")}`, `5. ${E[4][0]} : binôme, aide graduée, droit à l'erreur`,
        `6. ${E[5][0]} : ${activite || "modèle montré puis reproduit"}`].join("\n");
      f.rangee([`S${s.numero}`, `${s.titre}\n(${D.fmtDuree(s.minutes)})`, diapos, der, uniques(s.objectifs.flatMap((o) => [o.activite, o.exemple]).filter(Boolean)).join("\n")], { bande: k % 2 === 1 });
    });

    // Paramètres et sources
    f = new Feuille(wb, "Paramètres et sources", st, [44, 100], "Paramètres, hypothèses et sources", "", nomOrg);
    f.entetes(["Paramètre", "Valeur"], false, false);
    for (const [k, v] of [["Durée en centre (h)", String(r.heures_centre)], ["Date de début", r.date_debut], ["Jours de centre", r.jours], ["Créneaux", r.creneaux],
      ["Pauses (exclues des heures)", r.pauses], ["Rythme d'alternance", r.rythme || "aucun"], ["Fermetures", r.fermetures || "aucune"],
      ["Jours fériés", "La Réunion (dont 20 décembre), automatiques"],
      ["Accueil / ECF par AT / DP / Productions / Examen blanc / Bilan (h)", `${r.h_accueil} / ${r.h_ecf_par_at} / ${r.h_dossier_pro} / ${r.h_productions} / ${r.h_examen_blanc} (0 = durée du RE) / ${r.h_bilan}`],
      ["Pondération des compétences", r.poids_cp || "automatique (volume du REAC)"]]) f.rangee([k, v]);
    if (plan.jours_exclus.length) f.rangee(["Jours exclus du calendrier", plan.jours_exclus.map(([d, m]) => `${D.fr(d)} — ${m}`).join("\n")]);
    for (const h of ctx.hypotheses) f.rangee(["HYPOTHÈSE À CONFIRMER", h], { fond: st.fondAccent });
    f.ligne++;
    f.paragraphe("Sources", st.sousTitre);
    ctx.sources.forEach((s) => f.paragraphe("•  " + s));
    return new Blob([await wb.xlsx.writeBuffer()], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }

  // ------------------------------------------------------------------ contrastes (WCAG 2.1, critère 1.4.3)
  const lum = (hex) => { const v = [0, 2, 4].map((i) => parseInt(String(hex).replace("#", "").padEnd(6, "0").slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4));
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
  const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };
  // Couleur d'accent utilisable EN TEXTE sur fond blanc : l'accent s'il atteint 4,5:1, sinon la couleur principale
  const accentTexte = (c) => (contraste(c.couleur_secondaire, "FFFFFF") >= 4.5 ? c.couleur_secondaire : c.couleur_primaire);
  // Texte lisible posé sur un aplat : blanc, ou la couleur principale / le noir si le blanc ne contraste pas assez
  const texteSur = (fond, c) => (contraste(fond, "FFFFFF") >= 4.5 ? "FFFFFF" : contraste(fond, c.couleur_primaire) >= 4.5 ? c.couleur_primaire : "121212");
  D.contraste = contraste; D.accentTexte = accentTexte; D.texteSur = texteSur;

  // ------------------------------------------------------------------ Word
  function docWord(ctx, titre, construire) {
    const X = G.docx, c = ctx.charte, t = c.taille_texte * 2, FT = c.police_titres || c.police;
    const enfants = [];
    if (ctx.logo) enfants.push(new X.Paragraph({ children: [new X.ImageRun({ data: ctx.logo.octets, transformation: { width: Math.round(83 * ctx.logo.ratio), height: 83 } })] }));
    enfants.push(new X.Paragraph({ text: titre, heading: X.HeadingLevel.HEADING_1 }));
    if (ctx.nomOrg) enfants.push(new X.Paragraph({ text: ctx.nomOrg }));
    const outils = {
      h2: (s) => enfants.push(new X.Paragraph({ text: s, heading: X.HeadingLevel.HEADING_2 })),
      p: (s) => enfants.push(new X.Paragraph({ text: s })),
      puce: (s, niveau = 0) => enfants.push(new X.Paragraph({ text: s, bullet: { level: niveau } })),
      encadre: (titre, lignes) => enfants.push(new X.Table({ width: { size: 15000, type: X.WidthType.DXA }, columnWidths: [15000], rows: [new X.TableRow({ children: [new X.TableCell({
        width: { size: 15000, type: X.WidthType.DXA }, shading: { fill: c.couleur_claire, type: X.ShadingType.CLEAR, color: "auto" },
        children: [new X.Paragraph({ children: [new X.TextRun({ text: titre, bold: true, color: c.couleur_primaire, size: t + 4 })] })]
          .concat(lignes.map((l) => new X.Paragraph({ children: [new X.TextRun({ text: "• " + propre(l), size: t })] }))) })] })] }), new X.Paragraph({ text: "" })),
      lien: (texte, url) => enfants.push(new X.Paragraph({ children: [new X.ExternalHyperlink({ link: url, children: [new X.TextRun({ text: texte, style: "Hyperlink", size: t })] })] })),
      saut: () => enfants.push(new X.Paragraph({ children: [new X.PageBreak()] })),
      tableau: (lignes) => {
        const total = 15000;
        const poids = lignes[0].map((h, j) => { const L = lignes.map((r) => String(r[j] ?? "").length); const motLong = Math.max(...lignes.flatMap((r) => String(r[j] ?? "").split(/\s+/).map((m) => m.length)));
          return Math.min(45, Math.max(14, String(h).length + 6, motLong + 3, L.reduce((a, b) => a + b, 0) / L.length)); });
        const larg = poids.map((w) => Math.round((total * w) / poids.reduce((a, b) => a + b, 0)));
        enfants.push(new X.Table({ width: { size: total, type: X.WidthType.DXA }, columnWidths: larg,
          rows: lignes.map((row, i) => new X.TableRow({ tableHeader: i === 0, children: row.map((v, j) => new X.TableCell({
            width: { size: larg[j], type: X.WidthType.DXA },
            shading: i === 0 ? { fill: c.couleur_primaire, type: X.ShadingType.CLEAR, color: "auto" } : undefined,
            children: String(v ?? "").split("\n").map((ligne) => new X.Paragraph({ children: [new X.TextRun({ text: propre(ligne), bold: i === 0, color: i === 0 ? "FFFFFF" : c.couleur_texte, size: t })] })) })) })) }));
        enfants.push(new X.Paragraph({ text: "" }));
      },
    };
    construire(outils);
    const doc = new X.Document({
      creator: ctx.nomOrg || "", lastModifiedBy: ctx.nomOrg || "", title: titre, description: "",
      styles: { default: { document: { run: { font: c.police, size: t, color: c.couleur_texte } } },
        paragraphStyles: [
          { id: "Heading1", name: "Heading 1", basedOn: "Normal", next: "Normal", quickFormat: true, run: { font: FT, size: c.taille_titre * 2, bold: true, color: c.couleur_primaire }, paragraph: { spacing: { before: 240, after: 160 } } },
          { id: "Heading2", name: "Heading 2", basedOn: "Normal", next: "Normal", quickFormat: true, run: { font: FT, size: (c.taille_texte + 4) * 2, bold: true, color: accentTexte(c) }, paragraph: { spacing: { before: 240, after: 120 } } }] },
      sections: [{ properties: { page: { size: { width: 11906, height: 16838, orientation: X.PageOrientation.LANDSCAPE }, margin: { top: 907, bottom: 907, left: 907, right: 907 } } },
        // pied de page : bloc-marque légal (jamais en marque blanche : ctx.pied est vide dans ce cas)
        footers: ctx.pied ? { default: new X.Footer({ children: String(ctx.pied).split("\n").map((l) => new X.Paragraph({ children: [new X.TextRun({ text: l, size: Math.max(22, t - 6), color: c.couleur_texte })] })) }) } : undefined,
        children: enfants }],
    });
    return X.Packer.toBlob(doc);
  }

  function programmeDocx(ctx) {
    const [intitule, sections] = D.construireProgramme(ctx.reac, ctx.re, ctx.fiche, ctx.plan, ctx.r, ctx.tarif);
    return docWord(ctx, `Programme de formation — ${intitule}`, (o) => {
      for (const s of sections) { o.h2(s.titre); s.paragraphes.forEach(o.p); s.puces.forEach((x) => o.puce(x)); if (s.tableau.length) o.tableau(s.tableau); }
      o.p(`Mise à jour : ${D.fr(new Date(Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())))}`);
    });
  }
  function examenDocx(ctx) {
    const ex = D.construireExamen(ctx.reac, ctx.re, ctx.fiche);
    const titre = (ctx.fiche && ctx.fiche.intitule) || ctx.reac.intitule;
    return docWord(ctx, `L'examen en clair — ${titre}`, (o) => {
      if (ex.duree_totale) o.p(`Durée totale pour le candidat : ${ex.duree_totale}`);
      o.h2("Partie 1 — Les épreuves");
      if (ex.partie1.length > 1) o.tableau(ex.partie1);
      ex.consignes.forEach((x) => o.puce(x));
      o.h2("Partie 2 — Ce que le jury attend");
      for (const b of ex.partie2) {
        o.h2(b.cp);
        if (b.epreuves.length) o.p("Évaluée par : " + b.epreuves.join(", "));
        b.attendus.forEach((a) => o.puce(a));
        if (b.production) { o.p(`À préparer avant l'examen — partie de document (${b.production.pages}) :`); b.production.themes.forEach((t) => o.puce(t, 1)); }
      }
    });
  }

  // ------------------------------------------------------------ Agenda .ics
  const icsTxt = (s) => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n").replace(/[\x00-\x1f]/g, "");
  function pli(l) {
    const enc = new TextEncoder(), out = [];
    let cour = "";
    for (const ch of l) { if (enc.encode(cour + ch).length > 74) { out.push(cour); cour = " " + ch; } else cour += ch; }
    out.push(cour);
    return out.join("\r\n");
  }
  function ics(ctx) {
    const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Decorticage//FR", "CALSCALE:GREGORIAN", "BEGIN:VTIMEZONE", "TZID:Indian/Reunion", "BEGIN:STANDARD",
      "DTSTART:19700101T000000", "TZOFFSETFROM:+0400", "TZOFFSETTO:+0400", "TZNAME:RET", "END:STANDARD", "END:VTIMEZONE"];
    const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
    const ymd = (d) => D.iso(d).replace(/-/g, ""), hh = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}${String(m % 60).padStart(2, "0")}00`;
    for (const [, ls] of groupe(ctx.plan.lignes, (l) => D.iso(l.date) + "#" + l.seance.numero)) {

      try { const r = await D.lireFichier(f); lus.push([f.name, r, D.detecterType(r.texte)]); }
      catch (e) { res.erreurs.push(e.message || String(e)); }

      if (m.ht - pec > 0.009) parts.push({ part: "client", payeur: (a.pour_centre || (a.client && a.client.raison) || a.intitule || "Client").trim(), canal: a.canal || (pec > 0 ? canalReste(a) : canalParDefaut(a)), montant: arrondi((m.ht - pec) * k), ht: arrondi(m.ht - pec) });
      const existants = d.attendus.filter((x) => x.actionId === a.id);
      for (const p of parts) {
        let x = existants.find((e) => e.part === p.part);
        if (!x) { x = { id: uid(), actionId: a.id, part: p.part, encaissements: [], cree: jourIso() }; d.attendus.push(x); }
        Object.assign(x, { libelle: `${a.intitule || "Action"}${parts.length > 1 ? (p.part === "financeur" ? " — part financeur" : " — reste à charge") : ""}`,
          payeur: p.payeur, canal: p.canal, montant: p.montant, ht: p.ht, taux_tva: m.regime.taux, echeance, reference: a.numero_facture || "",
          annule: a.statut === "annulee" || !engage, origine_action: true });
      }
      // une part qui n'existe plus (prise en charge retirée) : annulée si rien n'a été reçu, sinon conservée
      for (const x of existants) if (!parts.find((p) => p.part === x.part)) { if (recu(x)) x.montant = recu(x); else x.annule = true; }
      a.encaisse = existants.length > 0 && existants.every((x) => x.annule || reste(x) <= 0.009) && existants.some((x) => !x.annule);
    }
    // les sommes d'une action supprimée disparaissent si rien n'a été reçu
    d.attendus = d.attendus.filter((x) => !x.actionId || d.actions.some((a) => a.id === x.actionId) || recu(x) > 0);
    return d.attendus;
  }
  // reste à charge après prise en charge : payé par l'entreprise, le centre donneur d'ordre ou le particulier
  const canalReste = (a) => (a.type === "soustraitance" || a.pour_centre ? "of" : a.type === "individuel" ? "particulier" : "entreprise");
  function canalParDefaut(a) {
    if (a.type === "soustraitance" || a.pour_centre) return "of";
    if (a.type === "individuel") return "particulier";
    return ({ opco_appr: "opco", opco_pro: "opco", opco_autres: "opco", cpf: "cpf", pouvoirs_publics: "france_travail", particuliers: "particulier", of: "of" })[a.origine] || "entreprise";
  }

  // ------------------------------------------------------------------ écritures liées aux encaissements
  function ecritureEncaissement(d, x, montant, date, libelle, mvtId) {
    const c = P.CANAUX[x.canal] || P.CANAUX.autre, a = d.actions.find((y) => y.id === x.actionId);
    const origine = a && a.type === "apprentissage" && x.canal === "opco" ? "opco_appr" : c.origine;
    const taux = num(x.taux_tva), ht = arrondi(montant / (1 + taux / 100));
    return { id: uid(), date, libelle, montant: arrondi(montant), montant_ht: ht, tva: arrondi(montant - ht), sens: "recette", origine, actionId: x.actionId || "", attenduId: x.id, mvtId: mvtId || "", statut: "realise" };
  }
  // Paiement reçu sans relevé bancaire (chèque, espèces, ou virement que vous confirmez à la main)
  function encaisserManuel(d, attenduId, { date, montant, mode }) {
    const x = d.attendus.find((y) => y.id === attenduId);
    if (!x) throw new Error("Somme attendue introuvable.");
    const m = arrondi(num(montant) || reste(x));
    if (m <= 0) throw new Error("Montant à préciser.");
    const e = ecritureEncaissement(d, x, m, date || jourIso(), `Reçu ${mode || "virement"} — ${x.payeur} — ${x.libelle}`, "");
    d.ecritures.push(e);
    x.encaissements.push({ id: uid(), date: e.date, montant: m, mode: mode || "virement", ecritureId: e.id });
    synchroAttendus(d);
    return x;
  }
  function annulerEncaissement(d, attenduId, encId) {
    const x = d.attendus.find((y) => y.id === attenduId), enc = x && x.encaissements.find((e) => e.id === encId);
    if (!enc) return;
    x.encaissements = x.encaissements.filter((e) => e !== enc);
    if (enc.mvtId) { const mv = d.mouvements.find((m) => m.id === enc.mvtId); if (mv) { mv.etat = "a_confirmer"; mv.attenduId = ""; mv.propositions = proposer(d, mv); } const ec = d.ecritures.find((e) => e.mvtId === enc.mvtId); if (ec) { ec.attenduId = ""; ec.origine = "autres"; } }
    else d.ecritures = d.ecritures.filter((e) => e.id !== enc.ecritureId);
    synchroAttendus(d);
  }

  // ------------------------------------------------------------------ ressemblance des noms
  const norm = (s) => D.normaliser(String(s || "")).replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const VIDES = new Set(["vir", "virement", "sepa", "recu", "de", "du", "des", "la", "le", "les", "et", "sarl", "sas", "sasu", "eurl", "sa", "ste", "societe", "inst", "instantane", "ref", "motif", "prlv", "cb", "carte", "facture", "fact", "fac", "paiement", "reglement", "ordre", "emetteur", "from", "to",
    // mots trop fréquents à La Réunion pour distinguer deux payeurs
    "reunion", "run", "ocean", "indien", "saint", "sainte", "denis", "pierre", "paul", "formation", "formations", "sud", "nord", "est", "ouest", "groupe", "centre"]);
  const mots = (s) => norm(s).split(" ").filter((m) => m.length >= 3 && !VIDES.has(m) && !/^\d+$/.test(m));
  const trigrammes = (s) => { const t = " " + norm(s).replace(/ /g, "") + " ", g = new Set(); for (let i = 0; i < t.length - 2; i++) g.add(t.slice(i, i + 3)); return g; };
  const dice = (a, b) => { const A = trigrammes(a), B = trigrammes(b); if (!A.size || !B.size) return 0; let n = 0; for (const x of A) if (B.has(x)) n++; return (2 * n) / (A.size + B.size); };
  /* Ressemblance entre le libellé bancaire et le nom du payeur (0 à 1) :
   * mots du nom retrouvés dans le libellé, ressemblance des lettres, alias appris, indices du canal (OPCO, Caisse des Dépôts…). */
  function ressemblance(d, libelle, x) {
    const L = norm(libelle), Lm = new Set(mots(libelle)), nom = mots(x.payeur);
    const appris = (d.alias[norm(x.payeur)] || []).some((al) => al && L.includes(al));
    if (appris) return { score: 1, raison: "libellé déjà associé à ce payeur" };
    const communs = nom.filter((m) => Lm.has(m) || [...Lm].some((l) => l.length >= 5 && (l.startsWith(m) || m.startsWith(l))));
    const partMots = nom.length ? communs.length / nom.length : 0;
    const lettres = dice(L, x.payeur);
    const canal = (P.CANAUX[x.canal] || { mots: [] }).mots.some((m) => L.includes(m)) ? 0.5 : 0;
    const score = Math.min(1, Math.max(partMots, lettres * 1.1, canal));
    const raison = communs.length ? `nom retrouvé : ${communs.join(", ")}` : canal ? `indice ${P.CANAUX[x.canal].lib}` : lettres > 0.35 ? `nom ressemblant (${Math.round(lettres * 100)} %)` : "";
    return { score, raison };
  }

  /* Propositions de rapprochement pour un virement reçu, de la plus probable à la moins probable.
   * Poids : montant 55 %, nom 35 %, date 10 % ; + bonus si le n° de facture figure dans le libellé. */
  function proposer(d, mv) {
    if (mv.sens !== "recette") return [];
    const auj = mv.date, out = [], L = norm(mv.libelle);
    for (const x of d.attendus) {
      if (x.annule) continue;
      const r = reste(x), raisons = [];
      // doublon : un paiement noté à la main du même montant, à ±15 jours, pas encore relié à la banque
      const manuel = x.encaissements.find((e) => !e.mvtId && Math.abs(num(e.montant) - mv.montant) < 0.01 && Math.abs(D.lireDate(e.date) - D.lireDate(mv.date)) <= 15 * 86400000);
      if (manuel) { out.push({ attenduId: x.id, score: 0.97, doublon: manuel.id, raisons: [`déjà noté reçu à la main le ${D.fr(D.lireDate(manuel.date))} : ce virement en est la trace bancaire`] }); continue; }
      if (r <= 0.009) continue;
      let sm = 0;
      if (Math.abs(r - mv.montant) < 0.01) { sm = 1; raisons.push("montant identique au reste dû"); }
      else if (Math.abs(num(x.montant) - mv.montant) < 0.01) { sm = 0.95; raisons.push("montant identique à la facture"); }
      else if (Math.abs(r - mv.montant) / r <= 0.02) { sm = 0.75; raisons.push("montant très proche (frais bancaires ?)"); }
      else if (mv.montant < r) { sm = 0.35; raisons.push(`paiement partiel possible (${Math.round((mv.montant / r) * 100)} % du reste)`); }
      const sn = ressemblance(d, mv.libelle, x); if (sn.raison) raisons.push(sn.raison);
      const ref = x.reference && norm(x.reference).length >= 3 && L.includes(norm(x.reference)) ? 0.25 : 0;
      if (ref) raisons.push(`référence ${x.reference} trouvée`);
      const ecart = x.echeance ? Math.abs(D.lireDate(auj) - D.lireDate(x.echeance)) / 86400000 : 60;
      const sd = ecart <= 30 ? 1 : ecart <= 90 ? 0.5 : 0.2;
      const score = Math.min(0.99, 0.55 * sm + 0.35 * sn.score + 0.1 * sd + ref);
      if (score >= 0.35 && (sm > 0 || sn.score >= 0.5 || ref)) out.push({ attenduId: x.id, score: Math.round(score * 100) / 100, raisons });
    }
    return out.sort((a, b) => b.score - a.score).slice(0, 4);
  }

  // ------------------------------------------------------------------ import du relevé bancaire
  function lireCsv(texte) {
    const lignes = texte.replace(/\r/g, "").split("\n").filter((l) => l.trim());
    if (lignes.length < 2) return [];
    const sep = [";", ",", "\t"].sort((a, b) => lignes[0].split(b).length - lignes[0].split(a).length)[0];
    const cellules = (l) => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map((x) => x.trim()); };
    // l'en-tête n'est pas toujours la 1re ligne (certaines banques ajoutent le n° de compte au-dessus)
    let iT = lignes.findIndex((l) => /date/i.test(l) && /(montant|debit|débit|credit|crédit|amount)/i.test(l));
    if (iT < 0) iT = 0;
    const tete = cellules(lignes[iT]).map((x) => D.normaliser(x));
    const col = (...cles) => tete.findIndex((h) => cles.some((c) => h.includes(c)));
    const iD = col("date"), iL = col("libelle", "label", "description", "operation", "intitule", "nature"), iM = col("montant", "amount"), iDe = col("debit"), iCr = col("credit");
    const res = [];
    for (const l of lignes.slice(iT + 1)) {
      const c = cellules(l);
      const m = iM >= 0 ? num(c[iM]) : num(c[iCr]) - Math.abs(num(c[iDe]));
      const d = lireDateBanque(c[iD] || "");
      if (!d || !m) continue;
      res.push({ date: d, libelle: (c[iL] || "").slice(0, 200), montant: Math.abs(m), sens: m > 0 ? "recette" : "depense" });
    }
    return res;
  }
  function lireDateBanque(s) {
    const m = /(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/.exec(s);
    if (m) return `${m[3].length === 2 ? "20" + m[3] : m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    const m2 = /(\d{4})-?(\d{2})-?(\d{2})/.exec(s); return m2 ? `${m2[1]}-${m2[2]}-${m2[3]}` : "";
  }
  // OFX / QFX (export « Money / Quicken » proposé par la plupart des banques françaises)
  function lireOfx(texte) {
    const res = [], blocs = texte.split(/<STMTTRN>/i).slice(1);
    const champ = (b, t) => { const m = new RegExp(`<${t}>([^<\\r\\n]*)`, "i").exec(b); return m ? m[1].trim() : ""; };
    for (const b of blocs) {
      const m = num(champ(b, "TRNAMT")), d = lireDateBanque(champ(b, "DTPOSTED").slice(0, 8));
      const lib = [champ(b, "NAME"), champ(b, "MEMO")].filter(Boolean).join(" ").replace(/&amp;/g, "&");
      if (d && m) res.push({ date: d, libelle: lib.slice(0, 200), montant: Math.abs(m), sens: m > 0 ? "recette" : "depense", fitid: champ(b, "FITID") });
    }
    return res;
  }
  const lireReleve = (texte) => (/<OFX>|<STMTTRN>/i.test(texte) ? lireOfx(texte) : lireCsv(texte));

  const DEPENSES_MOTS = [[/loyer|bail/i, "Location de salle"], [/hotel|salle|seminaire/i, "Location de salle"], [/air austral|air france|corsair|carbu|total|essence|peage|parking|taxi|uber/i, "Déplacements"],
    [/assur|hiscox|axa|maif|macif/i, "Assurance"], [/urssaf|cipav|retraite|prevoyance/i, "Cotisations sociales"], [/dgfip|impot|cfe|tresor/i, "Impôts et taxes"],
    [/frais|commission|cotis.*carte|banque/i, "Banque"], [/orange|sfr|free|bouygues|zeop|canal/i, "Télécom"], [/ovh|baserow|brevo|adobe|microsoft|google|canva|abonnement/i, "Logiciels et abonnements"],
    [/qualitia|certif/i, "Certification Qualiopi"], [/comptab|expert|avocat|honorair/i, "Honoraires (comptable, avocat)"]];

  /* Importe un relevé : chaque ligne nouvelle devient une écriture réalisée (le solde est juste tout de suite) ;
   * chaque virement reçu reçoit des propositions et attend VOTRE confirmation. */
  function importerReleve(d, texte) {
    const lus = lireReleve(texte), cles = new Set(d.mouvements.map((m) => m.cle));
    let nouveaux = 0, recettes = 0, depenses = 0;
    for (const m of lus) {
      const cle = m.fitid || `${m.date}|${m.montant.toFixed(2)}|${norm(m.libelle)}`;
      if (cles.has(cle)) continue;
      cles.add(cle);
      const mv = Object.assign({ id: uid(), cle, importe: jourIso(), etat: m.sens === "recette" ? "a_confirmer" : "depense", attenduId: "" }, m);
      const ec = { id: uid(), date: m.date, libelle: m.libelle || "(sans libellé)", montant: m.montant, sens: m.sens, statut: "realise", mvtId: mv.id, source: "banque" };
      if (m.sens === "recette") { ec.origine = "autres"; recettes++; }
      else { ec.categorie = (DEPENSES_MOTS.find(([r]) => r.test(m.libelle)) || [null, "Autre"])[1]; depenses++; }
      d.mouvements.push(mv); d.ecritures.push(ec); nouveaux++;
    }
    for (const mv of d.mouvements) if (mv.etat === "a_confirmer") mv.propositions = proposer(d, mv);
    return { lus: lus.length, nouveaux, recettes, depenses, doublons: lus.length - nouveaux };
  }
  // Vous confirmez : ce virement paie (tout ou partie de) cette somme attendue
  function confirmer(d, mvtId, attenduId) {
    const mv = d.mouvements.find((m) => m.id === mvtId), x = d.attendus.find((y) => y.id === attenduId);
    if (!mv || !x) throw new Error("Rapprochement introuvable.");
    const prop = (mv.propositions || []).find((p) => p.attenduId === attenduId);
    const ec = d.ecritures.find((e) => e.mvtId === mv.id);
    if (prop && prop.doublon) {
      // le paiement noté à la main est remplacé par sa trace bancaire (pas de double comptage)
      const enc = x.encaissements.find((e) => e.id === prop.doublon);
      d.ecritures = d.ecritures.filter((e) => e.id !== enc.ecritureId);
      Object.assign(enc, { mvtId: mv.id, ecritureId: ec && ec.id, mode: "virement (banque)" });
    } else x.encaissements.push({ id: uid(), date: mv.date, montant: mv.montant, mode: "virement (banque)", mvtId: mv.id, ecritureId: ec && ec.id });
    if (ec) Object.assign(ec, ecritureEncaissement(d, x, mv.montant, mv.date, ec.libelle, mv.id), { id: ec.id, source: "banque" });
    Object.assign(mv, { etat: "rapproche", attenduId: x.id });
    apprendre(d, x.payeur, mv.libelle);
    synchroAttendus(d);
    for (const m of d.mouvements) if (m.etat === "a_confirmer") m.propositions = proposer(d, m);
    return x;
  }
  // Retient les mots du libellé bancaire pour reconnaître ce payeur la prochaine fois
  function apprendre(d, payeur, libelle) {
    const k = norm(payeur), cle = mots(libelle).slice(0, 3).join(" ");
    if (!cle) return;
    const l = (d.alias[k] = d.alias[k] || []);
    if (!l.includes(cle)) l.push(cle);
  }
  // Ce virement n'est pas une facture attendue : autre recette (subvention, remboursement…) ou à ignorer
  function classer(d, mvtId, origine) {
    const mv = d.mouvements.find((m) => m.id === mvtId);
    if (!mv) return;
    mv.etat = origine === "ignorer" ? "ignore" : "autre";
    const ec = d.ecritures.find((e) => e.mvtId === mv.id);
    if (ec) ec.origine = origine === "ignorer" ? "autres" : origine;
  }

  // ------------------------------------------------------------------ tableau de bord
  function soldeBancaire(d) {
    const t = d.tresorerie || {};
    return arrondi(num(t.solde_initial) + d.ecritures.filter((e) => e.statut !== "prevu" && e.date >= (t.date_solde || "0000")).reduce((s, e) => s + (e.sens === "recette" ? 1 : -1) * num(e.montant), 0));
  }
  function tableauBord(d) {
    synchroAttendus(d);
    const auj = jourIso(), id = d.identite || {}, actifs = d.attendus.filter((x) => !x.annule);
    const solde = soldeBancaire(d);
    const du = arrondi(actifs.reduce((t, x) => t + reste(x), 0));
    const retard = actifs.filter((x) => etatAttendu(x, auj) === "retard");
    const dep = d.ecritures.filter((e) => e.statut === "prevu" && e.sens === "depense").reduce((t, e) => t + num(e.montant), 0);
    const recPrev = d.ecritures.filter((e) => e.statut === "prevu" && e.sens === "recette").reduce((t, e) => t + num(e.montant), 0);
    // TVA encaissée sur des factures qui la mentionnent (prestations de services : exigible à l'encaissement ;
    // toute TVA facturée est due, art. 283-3 du CGI), non encore déclarée
    const tva = arrondi(d.ecritures.filter((e) => e.sens === "recette" && e.statut !== "prevu" && num(e.tva) > 0 && !e.tva_declaree).reduce((t, e) => t + num(e.tva), 0));
    const tvaAVenir = arrondi(actifs.reduce((t, x) => t + reste(x) * (num(x.taux_tva) / (100 + num(x.taux_tva))), 0));
    const parCanal = {};
    for (const x of actifs) { const c = (parCanal[x.canal] = parCanal[x.canal] || { attendu: 0, recu: 0, reste: 0, n: 0 }); c.attendu += num(x.montant); c.recu += recu(x); c.reste += reste(x); c.n++; }
    const annee = auj.slice(0, 4), mois = auj.slice(0, 7);
    const enc = d.ecritures.filter((e) => e.sens === "recette" && e.statut !== "prevu");
    return { solde, du, retard: arrondi(retard.reduce((t, x) => t + reste(x), 0)), nbRetard: retard.length, nbDu: actifs.filter((x) => reste(x) > 0).length,
      depensesPrevues: arrondi(dep), recettesPrevues: arrondi(recPrev), tva, tvaAVenir,
      restera: arrondi(solde + du + recPrev - dep - tva - tvaAVenir), parCanal,
      encaisseMois: arrondi(enc.filter((e) => e.date.startsWith(mois)).reduce((t, e) => t + num(e.montant), 0)),
      encaisseAnnee: arrondi(enc.filter((e) => e.date.startsWith(annee)).reduce((t, e) => t + num(e.montant), 0)),
      aConfirmer: d.mouvements.filter((m) => m.etat === "a_confirmer").length };
  }

  // Trésorerie prévisionnelle : solde + sommes attendues à leur échéance + écritures prévues − charges moyennes
  function tresorerie(d, horizon = 90) {
    synchroAttendus(d);
    const auj = jourIso(), solde = soldeBancaire(d);
    const realise = d.ecritures.filter((e) => e.statut !== "prevu");
    const mouvements = [];
    for (const x of d.attendus) { const r = reste(x); if (r > 0) mouvements.push({ date: !x.echeance || x.echeance < auj ? auj : x.echeance, montant: r }); }
    for (const e of d.ecritures.filter((y) => y.statut === "prevu")) mouvements.push({ date: (e.echeance || e.date) < auj ? auj : e.echeance || e.date, montant: (e.sens === "recette" ? 1 : -1) * num(e.montant) });
    const il3m = D.iso(D.ajoutJours(D.lireDate(auj), -90));
    const chargeJour = realise.filter((e) => e.sens === "depense" && e.date >= il3m).reduce((t, e) => t + num(e.montant), 0) / 90;
    mouvements.sort((a, b) => a.date.localeCompare(b.date));
    const courbe = [];
    let s = solde, k = 0;
    for (let j = D.lireDate(auj), n = 0; n <= horizon; j = D.ajoutJours(j, 7), n += 7) {
      const iso = D.iso(j);
      while (k < mouvements.length && mouvements[k].date <= iso) s += mouvements[k++].montant;
      courbe.push({ date: iso, solde: Math.round(s - chargeJour * n) });
    }
    const pointBas = courbe.reduce((m, c) => (c.solde < m.solde ? c : m), courbe[0]);
    const il12m = D.iso(D.ajoutJours(D.lireDate(auj), -365));
    const ca12 = realise.filter((e) => e.sens === "recette" && e.date >= il12m).reduce((t, e) => t + num(e.montant), 0);
    const totalCreances = d.attendus.reduce((t, x) => t + reste(x), 0);

  async function genererSeance(f, date, silencieux) {
    if (etat.generation) return;
    const ps = prochaineSeance(f), jour = P.journee(ps.pr.futur, date);
    if (!jour) return;
    const ctl = new AbortController();
    etat.generation = { ctl, message: "Claude réfléchit… (la première fois, autorisez l'accès à Claude)" };
    if (etat.vue === "seance") rendre();
    let car = 0;
    try {
      const r = await P.redigerSeance(ps.ctx, jour, { public: f.reglages.public, signal: ctl.signal, onText: ({ text }) => { car = text.length; const e = $("#gen-etat"); if (e) e.textContent = `Claude rédige… ${car.toLocaleString("fr-FR")} caractères`; } });
      f.packs = f.packs || {};
      f.packs[date] = { date, titre: r.pack.titre, contenu: r.pack, source: r.source, raison: r.raison || "", cree: auj(), objectifs_reac: r.matiere.objectifs.map((o) => o.objectif) };

    } catch (e) { if (!(e && e.code === "cancelled")) toast("Rédaction interrompue.", "ko"); }

  }

      else if (act === "classer-mvt") { P.classer(d(), b.dataset.m, ($("#cls-" + b.dataset.m) || {}).value || "autres"); sauver(); rendre(); toast("Classé en autre recette."); }
      else if (act === "ignorer-mvt") { P.classer(d(), b.dataset.m, "ignorer"); sauver(); rendre(); }
      else if (act === "ouvrir-paiement") { etat.paiementOuvert = etat.paiementOuvert === b.dataset.a ? null : b.dataset.a; rendre(); }
      else if (act === "annuler-enc") { P.annulerEncaissement(d(), b.dataset.a, b.dataset.e); sauver(); rendre(); toast("Encaissement annulé."); }
      else if (act === "suppr-attendu") { const x = d().attendus.find((y) => y.id === b.dataset.a); if (x && !P.recu(x)) { d().attendus = d().attendus.filter((y) => y !== x); sauver(); rendre(); } else toast("Annulez d'abord les paiements reçus.", "alerte"); }
      else if (act === "gen-biblio") { await enregistrer(...(await P.genererBiblio(d(), b.dataset.id, etat.logo))); }
      else if (act === "suppr-ecr") { d().ecritures = d().ecritures.filter((x) => x.id !== b.dataset.id); sauver(); rendre(); }
      else if (act === "exp-compta") await enregistrer(`Tableau_comptable_${auj()}.xlsx`, await exportCompta());
      else if (act === "exp-bpf") await enregistrer(...(await exportBpf()));
      else if (act === "suppr-part") { d().partenaires = d().partenaires.filter((x) => x.id !== b.dataset.id); sauver(); rendre(); }
      else if (act === "modele-mail") { $("#mail").value = MAILS[b.dataset.k](d().identite); }
      else if (act === "copier-mail") { const t = $("#mail"); try { await navigator.clipboard.writeText(t.value); toast("Copié."); } catch (err) { t.select(); toast("Sélectionné : faites Ctrl+C.", "alerte"); } }
      else if (act === "sauvegarde") { const txt = await C.exporter(); d().derniere_sauvegarde = new Date().toISOString(); sauver(); await enregistrer(`Sauvegarde_pilotage_${auj()}.json`, txt); rendre(); }
      else if (act === "verrouiller") { C.verrouiller(); afficherConnexion("Coffre verrouillé."); }
      else if (act === "retirer-logo") { d().charte.logo = ""; etat.logo = null; sauver(); rendre(); }
      else if (act === "effacer") { if (b.dataset.confirme) { await C.effacer(); afficherConnexion("Données effacées de ce navigateur."); } else { b.dataset.confirme = "1"; b.textContent = "Cliquez à nouveau : TOUT sera effacé (faites une sauvegarde avant)"; } }
    } catch (err) { b.disabled = false; toast(err.message || String(err), "ko"); }
  });
  document.addEventListener("change", (e) => {
    const el = e.target, act = el.dataset && el.dataset.act;
    if (!act) return;
    if (act === "etat-doc") { const a = d().actions.find((x) => x.id === etat.actionSel); a.docs = a.docs || {}; a.docs[el.dataset.doc] = Object.assign(a.docs[el.dataset.doc] || {}, { etat: el.value, date: auj() }); sauver(); }
    else if (act === "statut-ind" || act === "na-ind" || act === "note-ind") {
      const n = el.closest("[data-n]").dataset.n, s = (d().qualiopi.suivi[n] = d().qualiopi.suivi[n] || {});
      if (act === "statut-ind") s.statut = el.value; else if (act === "na-ind") s.na = el.checked; else s.note = el.value.slice(0, 4000);
      sauver();
      if (act !== "note-ind") rendre();
    }
    else if (act === "tri-att") { etat.triAtt = el.value; rendre(); }
    else if (act === "filtre-att") { etat.filtreAtt = el.value; rendre(); }
    else if (act === "grouper-att") { etat.grouperAtt = el.checked; rendre(); }
    else if (act === "statut-bib") { const v = (d().bibliotheque[el.dataset.id] = d().bibliotheque[el.dataset.id] || {}); v.statut = el.value; sauver(); }
    else if (act === "depot-biblio") {
      const fi = el.files[0]; if (!fi) return;
      if (fi.size > 15 * 1024 * 1024) { toast("15 Mo maximum.", "ko"); return; }
      (async () => { const id = await C.deposerFichier(fi.name.slice(0, 120), fi.type, new Uint8Array(await fi.arrayBuffer()));
        const v = (d().bibliotheque[el.dataset.id] = d().bibliotheque[el.dataset.id] || {}); (v.fichiers = v.fichiers || []).push(id); v.date = auj(); if (!v.statut || v.statut === "") v.statut = "en_vigueur";
        sauver(); rendre(); toast("Document déposé dans la bibliothèque (chiffré) : il prouve désormais les indicateurs liés."); })().catch((err) => toast(err.message, "ko"));
    }
    else if (act === "relance-part") { const p = d().partenaires.find((x) => x.id === el.dataset.id); p.relance = el.value; sauver(); }
  });

  // ------------------------------------------------------------ démarrage
  document.querySelectorAll("#nav a").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); if (C.cle) { if (a.dataset.v === "formations") etat.formationSel = null; if (a.dataset.v === "actions") etat.actionSel = null; aller(a.dataset.v); } }));
  afficherConnexion();
})();

</script>
