.verso .name span{font-weight:600}

.verso .qr svg{display:block;width:100%;height:auto}

</template>

    <div class="grid"></div>
    <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>

      <svg class="node" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#1B3A6B" stroke-width="2.2" stroke-linecap="round"><circle cx="20" cy="22" r="6.5"/><path d="M14.6 18.6 7 13M25.4 18.6 33 13M20 15.5V6"/></g><g fill="#C9A84C"><circle cx="7" cy="13" r="3"/><circle cx="33" cy="13" r="3"/><circle cx="20" cy="6" r="3"/></g><circle cx="20" cy="22" r="2.4" fill="#1B3A6B"/></svg>

    <div class="role mono">Directeur · Formateur &amp; consultant IA</div>

    <dl>
      <dt>TEL</dt><dd>+262 693 32 24 45</dd>
      <dt>MAIL</dt><dd>yebaformations@gmail.com</dd>
      <dt>WEB</dt><dd>www.yebaformations.re</dd>
      <dt>ADR</dt><dd>9 rue Françoise Châtelain<br>97490 Sainte-Clotilde</dd>
    </dl>
    <div class="qr">__QR__<div class="cap mono"><span>vCard</span><span>scan →</span></div></div>

  </div>

<div id="stage">
  <div id="bg"></div><div id="shade"></div>
  <div class="top"><i></i>Carte de visite · YEBA FORMATIONS</div>
  <div id="floor"></div>
  <div id="scene"><div id="card"><div class="side front" id="front"></div><div class="side back" id="back"></div></div></div>
  <div class="cap" id="cap1"><h1>Aurélien <span>LUMEKA</span></h1><p>Formation · IA · Gouvernance RGPD &amp; IA Act</p></div>
  <div class="cap2" id="cap2"><h2>Scannez le QR code :<br><b>mon contact s’enregistre</b></h2><p>Aucune application, aucune donnée transmise à un tiers</p></div>
  <div class="foot">+262 693 32 24 45<small>www.yebaformations.re · yebaformations@gmail.com</small></div>

<script src="qr.js"></script>
<script>
const D = 10, $ = s => document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), span=(t,a,b)=>cl((t-a)/(b-a));
const ease = x => { x = cl(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
$('#front').innerHTML = document.getElementById('tRecto').innerHTML;
$('#back').innerHTML = document.getElementById('tVerso').innerHTML.replace('__QR__', window.QRSVG);
function setT(t){
  t = ((t % D) + D) % D;
  const flip = 180*ease(span(t,3.0,3.9)) + 180*ease(span(t,7.8,8.7));
  $('#card').style.transform = `rotateY(${flip + 4*Math.sin(t/D*2*Math.PI)}deg) rotateX(${2.5*Math.sin(t/D*4*Math.PI)}deg)`;
  const sh = $('#front .shine'); sh.style.opacity = 1; sh.style.backgroundPosition = `${100 - span(t,0.7,2.3)*100}% 0`;
  const gp = .75 + .25*Math.sin(t/D*6*Math.PI);
  document.querySelectorAll('#front .glow, #front .glow2').forEach(g => g.style.opacity = gp);
  [...document.querySelectorAll('#back .name, #back .role, #back .rule, #back dl > *, #back .qr')].forEach((el,i)=>{ const k = t>8.6||t<3.4 ? 1 : ease(span(t,3.7+i*.08,4.2+i*.08)); el.style.opacity = k; });
  const v2 = ease(span(t,3.4,3.9)) * (1-ease(span(t,7.7,8.2)));
  $('#cap1').style.opacity = 1 - v2; $('#cap2').style.opacity = v2; $('#cap2').style.transform = `translateY(${(1-v2)*20}px)`;
  $('#floor').style.transform = `scaleX(${.85 + .15*Math.abs(Math.cos(flip*Math.PI/180))})`;
  $('#bg').style.transform = `scale(${1.05 + .04*Math.sin(t/D*2*Math.PI)})`;
}
window.setT = setT; setT(0);
</script></body></html>
