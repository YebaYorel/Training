const out = x => 1 - Math.pow(1 - cl(x), 3);
$('#front').innerHTML = document.getElementById('tRectoA').innerHTML;
$('#back').innerHTML = document.getElementById('tVerso').innerHTML.replace('__QR__', window.QRSVG);
const L = [...document.querySelectorAll('#front .streaks line')].map(l => [l, +l.dataset.o]);
function setT(t){
  t = ((t % D) + D) % D;
  // Recto : progression p (0 → 1 pendant l'entrée, remise à zéro pendant que le verso est visible)
  const p = t < 6.5 ? out(span(t, 0.15, 4.4)) : 0;
  $('#front .bgimg').style.transform = `scale(${1 + .22*p})`;
  const ls = .58 + .42*p;
  $('#front .logoA').style.transform = `scale(${ls})`;
  const glow = 4 + 10*p + 6*Math.max(0, Math.sin((t-3.4)/1.4*Math.PI))*(t>3.4&&t<4.8);
  $('#front .logoA').style.filter = `drop-shadow(0 0 ${glow*.35}px rgba(255,214,120,.95)) drop-shadow(0 0 ${glow}px rgba(255,190,90,.6))`;
  const b = t < 6.5 ? (.9*Math.exp(-Math.pow((t-4.0)/.55,2)) + .22*p) : 0;
  $('#front .burst').style.opacity = b; $('#front .burst').style.transform = `rotate(${t*6}deg) scale(${.8 + .3*p})`;
  $('#front .veilA').style.opacity = .55 + .35*p;
  $('#front .flare').style.opacity = .55 + .3*Math.sin(t/D*8*Math.PI)**2;
  for (const [l, o] of L) l.setAttribute('stroke-dashoffset', (o - t*84*(1+.6*p)) % 126);
  const sh = $('#front .shine'); sh.style.opacity = 1; sh.style.backgroundPosition = `${100 - span(t,4.4,5.4)*100}% 0`;
  // Retournements
  const flip = 180*ease(span(t,5.0,5.9)) + 180*ease(span(t,10.4,11.3));
  $('#card').style.transform = `rotateY(${flip + 3*Math.sin(t/D*2*Math.PI)}deg) rotateX(${2*Math.sin(t/D*4*Math.PI)}deg)`;
  [...document.querySelectorAll('#back .name, #back .role, #back .rule, #back dl > *, #back .qr, #back .foot')].forEach((el,i)=>{ const k = (t>10.3||t<5.4) ? 1 : ease(span(t,5.7+i*.08,6.2+i*.08)); el.style.opacity = k; });
  const pl = span(t,7.0,8.8); $('#back .qr .plate').style.boxShadow = `0 0 0 calc(.3*var(--mm)) #C9A84C, 0 0 calc(2.2*var(--mm)) rgba(226,196,110,.35), 0 0 0 ${pl*36}px rgba(226,196,110,${.3*(1-pl)})`;
  const v2 = ease(span(t,5.4,5.9)) * (1-ease(span(t,10.3,10.8)));
  $('#cap1').style.opacity = 1 - v2; $('#cap2').style.opacity = v2; $('#cap2').style.transform = `translateY(${(1-v2)*20}px)`;
  $('#floor').style.transform = `scaleX(${.85 + .15*Math.abs(Math.cos(flip*Math.PI/180))})`;
  $('#bg').style.transform = `scale(${1.05 + .04*Math.sin(t/D*2*Math.PI)})`;
}
window.setT = setT; setT(0);
</script></body></html>
