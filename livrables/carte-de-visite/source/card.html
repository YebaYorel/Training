<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Carte de visite — Aurélien LUMEKA · YEBA FORMATIONS</title>
<style>
@font-face{font-family:"Montserrat";font-weight:600;src:url(fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:"Montserrat";font-weight:800;src:url(fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:"Montserrat";font-weight:900;src:url(fontsource/montserrat/files/montserrat-latin-900-normal.woff2)}
@font-face{font-family:"Mono";font-weight:500;src:url(fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:"Mono";font-weight:700;src:url(fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2)}
:root{--navy:#1B3A6B;--gold:#C9A84C;--ink:#121212;--paper:#F7F7F5;--grey:#5A5F6A;--mm:3.7795px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#2a2a2a}
body{font-family:Inter,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.u{--m:var(--mm)}
/* Une face = 91 x 61 mm (85 x 55 + 3 mm de fond perdu). Tout est en --mm. */
.face{position:relative;width:calc(91*var(--mm));height:calc(61*var(--mm));overflow:hidden}
.trim{position:relative;width:calc(85*var(--mm));height:calc(55*var(--mm));overflow:hidden;border-radius:calc(var(--r,0)*var(--mm))}
.trim>.face{position:absolute;left:calc(-3*var(--mm));top:calc(-3*var(--mm))}

/* ================= RECTO : le couloir « IA », YEBA FORMATIONS à la place de AI ================= */
.recto{background:#06101F url(clean2x.jpg) 50% 50%/auto 100% no-repeat}
.recto .veil{position:absolute;left:calc(22*var(--mm));top:calc(19*var(--mm));width:calc(47*var(--mm));height:calc(22*var(--mm));background:radial-gradient(closest-side,rgba(4,10,22,.78),rgba(4,10,22,.45) 55%,transparent);filter:blur(calc(1*var(--mm)))}
.recto .word{position:absolute;left:0;right:0;top:calc(23*var(--mm));text-align:center;padding-left:calc(.4*var(--mm))}
.gold{background:linear-gradient(180deg,#FFF6CF 0%,#F3D98A 28%,#E2BE5F 52%,#C99A3A 78%,#9C7424 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.recto .yeba{position:relative;display:block;font-family:Montserrat;font-weight:900;font-size:calc(9.4*var(--mm));line-height:1;letter-spacing:.01em;filter:drop-shadow(0 calc(.3*var(--mm)) calc(.4*var(--mm)) rgba(0,0,0,.6))}
.recto .form{position:relative;display:block;margin-top:calc(1.1*var(--mm));font-family:Montserrat;font-weight:800;font-size:calc(2.75*var(--mm));letter-spacing:.32em;padding-left:.3em;line-height:1}
/* halo : copie floue derrière le texte doré */
.recto .glow{position:absolute;inset:0;color:#FFD47A;filter:blur(calc(.8*var(--mm)));opacity:.9}
.recto .glow2{position:absolute;inset:0;color:#FFB84A;filter:blur(calc(3*var(--mm)));opacity:.55}
.recto .edge{position:absolute;inset:0;color:transparent;-webkit-text-stroke:calc(.07*var(--mm)) rgba(255,246,210,.75)}
/* reflet au sol */
.recto .refl{position:absolute;left:0;right:0;top:calc(38.8*var(--mm));text-align:center;transform:scaleY(-1);opacity:.16;filter:blur(calc(.5*var(--mm)));
  -webkit-mask-image:linear-gradient(0deg,#000,transparent 70%);mask-image:linear-gradient(0deg,#000,transparent 70%)}
.recto .refl span{font-family:Montserrat;font-weight:900;font-size:calc(9.4*var(--mm));color:#F3D98A;line-height:1}
.recto .shine{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,0) 42%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 58%,transparent 65%);background-size:300% 100%}

/* ================= VERSO SOMBRE : accordé au couloir « IA » ================= */
.verso{color:#F4F6FA;background:
  radial-gradient(ellipse 75% 55% at 50% 122%,rgba(69,211,245,.26),transparent 62%),
  radial-gradient(ellipse 55% 45% at 88% -12%,rgba(226,196,110,.20),transparent 62%),
  linear-gradient(160deg,#0C1B32 0%,#07101E 55%,#040A14 100%)}
.verso .floor{position:absolute;left:0;right:0;bottom:0;height:calc(24*var(--mm));opacity:.55;
  -webkit-mask-image:linear-gradient(0deg,#000 10%,transparent 95%);mask-image:linear-gradient(0deg,#000 10%,transparent 95%)}
.verso .traces{position:absolute;right:calc(3*var(--mm));top:calc(3*var(--mm));width:calc(26*var(--mm));height:calc(14*var(--mm));opacity:.55}
.verso .frame{position:absolute;inset:calc(6.4*var(--mm));border:calc(.14*var(--mm)) solid rgba(226,196,110,.42)}
.verso .frame i{position:absolute;width:calc(1.1*var(--mm));height:calc(1.1*var(--mm));background:#E2C46E;box-shadow:0 0 calc(.8*var(--mm)) rgba(226,196,110,.8)}
.verso .frame i:nth-child(1){left:calc(-.62*var(--mm));top:calc(-.62*var(--mm))}
.verso .frame i:nth-child(2){right:calc(-.62*var(--mm));top:calc(-.62*var(--mm))}
.verso .frame i:nth-child(3){left:calc(-.62*var(--mm));bottom:calc(-.62*var(--mm))}
.verso .frame i:nth-child(4){right:calc(-.62*var(--mm));bottom:calc(-.62*var(--mm))}
.mono{font-family:Mono,monospace;text-transform:uppercase}
.verso .hdr{position:absolute;left:calc(10*var(--mm));right:calc(10*var(--mm));top:calc(9.6*var(--mm));display:flex;justify-content:space-between;align-items:center;font-size:calc(1.85*var(--mm));letter-spacing:.2em;color:#8FA2C2}
.verso .hdr b{color:#E2C46E;font-weight:700}
.verso .node{width:calc(5.4*var(--mm));height:calc(5.4*var(--mm));filter:drop-shadow(0 0 calc(.6*var(--mm)) rgba(69,211,245,.55))}
.verso .name{position:absolute;left:calc(10*var(--mm));top:calc(15*var(--mm));font-family:Montserrat;font-weight:800;font-size:calc(4.5*var(--mm));line-height:1.05;letter-spacing:.005em;filter:drop-shadow(0 0 calc(.9*var(--mm)) rgba(226,190,95,.35))}
.verso .name span{font-weight:600}
.verso .role{position:absolute;left:calc(10*var(--mm));top:calc(21*var(--mm));font-size:calc(1.8*var(--mm));letter-spacing:.06em;color:#B5C3DA}
.verso .rule{position:absolute;left:calc(10*var(--mm));top:calc(24.4*var(--mm));width:calc(12*var(--mm));height:calc(.4*var(--mm));background:linear-gradient(90deg,#F3D98A,#C99A3A 70%,transparent)}
.verso dl{position:absolute;left:calc(10*var(--mm));top:calc(27.2*var(--mm));display:grid;grid-template-columns:calc(8.5*var(--mm)) auto;row-gap:calc(1.25*var(--mm));align-items:baseline}
.verso dt{font-family:Mono,monospace;font-weight:700;font-size:calc(1.85*var(--mm));letter-spacing:.14em;color:#6FDCF7}
.verso dd{font-size:calc(2.5*var(--mm));font-weight:500;color:#F4F6FA;line-height:1.05;white-space:nowrap}
.verso .qr{position:absolute;right:calc(9.8*var(--mm));top:calc(24.2*var(--mm));width:calc(22.6*var(--mm))}
.verso .qr .plate{padding:calc(1.3*var(--mm));background:#F7F7F5;box-shadow:0 0 0 calc(.3*var(--mm)) #C9A84C,0 0 calc(2.2*var(--mm)) rgba(226,196,110,.35)}
.verso .qr svg{display:block;width:100%;height:auto}
.verso .qr .cap{margin-top:calc(1.2*var(--mm));display:flex;justify-content:space-between;font-size:calc(1.55*var(--mm));letter-spacing:.12em;color:#8FA2C2}
.verso .foot{position:absolute;left:calc(10*var(--mm));right:calc(10*var(--mm));bottom:calc(9.4*var(--mm));padding-top:calc(1.2*var(--mm));border-top:calc(.12*var(--mm)) solid rgba(143,162,194,.35);display:flex;justify-content:space-between;font-size:calc(1.6*var(--mm));letter-spacing:.14em;color:#8FA2C2}
.verso .foot b{color:#E2C46E;font-weight:700}

/* Masque de dorure (verso) : noir 100 % = zones dorées, blanc = sans dorure */
body.foil{background:#fff}
body.foil .verso{background:#fff}
body.foil .verso > *{visibility:hidden}
body.foil .verso .name,body.foil .verso .rule,body.foil .verso .frame,body.foil .verso .frame i{visibility:visible}
body.foil .verso .name{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#000;filter:none}
body.foil .verso .rule{background:#000}
body.foil .verso .frame{border-color:#000}
body.foil .verso .frame i{background:#000;box-shadow:none}
body.print{background:#fff}
body.print .face{page-break-after:always;break-after:page}
@page{size:91mm 61mm;margin:0}
</style></head>
<body>
<template id="tRecto">
  <div class="face recto">
    <div class="veil"></div>
    <div class="refl"><span>YEBA</span></div>
    <div class="word">
      <span class="yeba"><span class="glow2">YEBA</span><span class="glow">YEBA</span><span class="gold" style="position:relative">YEBA</span></span>
      <span class="form"><span class="glow" style="filter:blur(calc(.5*var(--mm)))">FORMATIONS</span><span class="gold" style="position:relative">FORMATIONS</span></span>
    </div>
    <div class="shine"></div>
  </div>
</template>
<template id="tVerso">
  <div class="face verso">
    <svg class="floor" viewBox="0 0 910 240" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke-width="1.1">
        <g stroke="#45D3F5" stroke-opacity=".55"><path d="M455 0 L-200 240"/><path d="M455 0 L40 240"/><path d="M455 0 L250 240"/><path d="M455 0 L660 240"/><path d="M455 0 L870 240"/><path d="M455 0 L1110 240"/></g>
        <g stroke="#E2C46E" stroke-opacity=".45"><path d="M455 0 L-80 240"/><path d="M455 0 L150 240"/><path d="M455 0 L760 240"/><path d="M455 0 L990 240"/></g>
        <g stroke="#45D3F5" stroke-opacity=".28"><path d="M0 120 H910"/><path d="M0 170 H910"/><path d="M0 214 H910"/></g>
      </g>
    </svg>
    <svg class="traces" viewBox="0 0 260 140" aria-hidden="true">
      <g fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M260 22 H190 L170 42 H120" stroke="#E2C46E" stroke-opacity=".7"/>
        <path d="M260 60 H210 L192 78 H150" stroke="#45D3F5" stroke-opacity=".6"/>
        <path d="M220 0 V12 L206 26" stroke="#45D3F5" stroke-opacity=".4"/>
      </g>
      <g fill="#E2C46E"><circle cx="120" cy="42" r="3"/></g><g fill="#45D3F5"><circle cx="150" cy="78" r="2.6"/></g>
    </svg>
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <div class="hdr mono"><span><b>YEBA FORMATIONS</b> · 974</span>
      <svg class="node" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#E2C46E" stroke-width="2.2" stroke-linecap="round"><circle cx="20" cy="22" r="6.5"/><path d="M14.6 18.6 7 13M25.4 18.6 33 13M20 15.5V6"/></g><g fill="#45D3F5"><circle cx="7" cy="13" r="3"/><circle cx="33" cy="13" r="3"/><circle cx="20" cy="6" r="3"/></g><circle cx="20" cy="22" r="2.4" fill="#E2C46E"/></svg>
    </div>
    <div class="name gold">Aurélien <span>LUMEKA</span></div>
    <div class="role mono">Directeur · Formateur &amp; consultant IA</div>
    <div class="rule"></div>
    <dl>
      <dt>TEL</dt><dd>+262 693 32 24 45</dd>
      <dt>MAIL</dt><dd>yebaformations@gmail.com</dd>
      <dt>WEB</dt><dd>www.yebaformations.re</dd>
      <dt>ADR</dt><dd>9 rue Françoise Châtelain<br>97490 Sainte-Clotilde</dd>
    </dl>
    <div class="qr"><div class="plate">__QR__</div></div>
    <div class="foot mono"><span><b>QUALIOPI</b> · ACTIONS DE FORMATION</span><span>RGPD · IA ACT</span></div>
  </div>
</template>
<div id="root"></div>
<script src="qr.js"></script>
<script>
async function build(mode, opts = {}) {
  const R = document.getElementById('tRecto').innerHTML, V = document.getElementById('tVerso').innerHTML.replace('__QR__', window.QRSVG);
  const root = document.getElementById('root');
  document.body.className = mode;
  if (opts.mm) document.documentElement.style.setProperty('--mm', opts.mm + 'px');
  if (mode === 'print') root.innerHTML = R + V;
  else if (mode === 'foil') root.innerHTML = V;
  else root.innerHTML = `<div class="trim" id="tr" style="--r:${opts.r || 0}">${R}</div><div style="height:20px"></div><div class="trim" id="tv" style="--r:${opts.r || 0}">${V}</div>`;
  await document.fonts.ready;
  await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'clean2x.jpg'; });
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
}
window.build = build;
</script>
</body></html>
